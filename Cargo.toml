[package]
name = "blazinterner"
description = "Efficient and concurrent interning of generic data"
version = "0.5.0"
authors = ["Guillaume Endignoux <ggendx@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gendx/blazinterner"
categories = ["caching", "memory-management", "concurrency"]
keywords = ["arena", "interning", "interner"]
exclude = [".github/*"]
edition = "2024"
rust-version = "1.91.0"

[package.metadata.docs.rs]
features = ["debug", "delta", "get-size2", "raw", "retain", "serde", "sync"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = ["sync"]
debug = ["get-size2"]
delta = []
get-size2 = ["dep:get-size2"]
raw = []
retain = ["dep:bit-set"]
serde = ["dep:serde", "dep:serde_tuple"]
sync = ["dep:appendvec", "dep:dashtable"]

[dependencies]
appendvec = { optional = true, version = "0.1.5" }
bit-set = { optional = true, version = "0.11.1" }
dashtable = { optional = true, version = "0.2.0" }
get-size2 = { optional = true, version = "0.10.3", features = ["derive"] }
hashbrown = "0.17.1"
serde = { optional = true, version = "1.0.229", features = ["derive"] }
serde_cow = "0.1.2"
serde_tuple = { optional = true, version = "1.1.3" }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
serde_json = "1.0.151"
